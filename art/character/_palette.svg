<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200">
  <!-- Select everything, then Swatches panel > New Color Group > "Selected Artwork". -->
  <g id="face">
    <rect x="10" y="10" width="30" height="30" rx="6" fill="#2E2A3B"/>
    <rect x="50" y="10" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#DDDDDD"/>
    <rect x="90" y="10" width="30" height="30" rx="6" fill="#FF9FB0"/>
  </g>
  <g id="greens">
    <rect x="10" y="60" width="30" height="30" rx="6" fill="#2FA56A"/>
    <rect x="50" y="60" width="30" height="30" rx="6" fill="#3DBE7A"/>
    <rect x="90" y="60" width="30" height="30" rx="6" fill="#5FD69A"/>
    <rect x="130" y="60" width="30" height="30" rx="6" fill="#7BE3AE"/>
  </g>
  <g id="accents">
    <rect x="10" y="110" width="30" height="30" rx="6" fill="#FF9F43"/>
    <rect x="50" y="110" width="30" height="30" rx="6" fill="#F5B92E"/>
    <rect x="90" y="110" width="30" height="30" rx="6" fill="#7B6CF6"/>
    <rect x="130" y="110" width="30" height="30" rx="6" fill="#F2667A"/>
    <rect x="170" y="110" width="30" height="30" rx="6" fill="#4CB4F0"/>
    <rect x="210" y="110" width="30" height="30" rx="6" fill="#EF7BC0"/>
    <rect x="250" y="110" width="30" height="30" rx="6" fill="#2FBFB0"/>
  </g>
  <g id="pots">
    <rect x="10" y="160" width="30" height="30" rx="6" fill="#C4623F"/>
    <rect x="50" y="160" width="30" height="30" rx="6" fill="#E07A5F"/>
    <rect x="90" y="160" width="30" height="30" rx="6" fill="#F2A07F"/>
    <rect x="150" y="160" width="30" height="30" rx="6" fill="#A66F3E"/>
    <rect x="190" y="160" width="30" height="30" rx="6" fill="#C8915A"/>
    <rect x="230" y="160" width="30" height="30" rx="6" fill="#E0B07D"/>
  </g>
</svg>
