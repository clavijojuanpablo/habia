<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Guides: turn this group into guides in Illustrator (select it, Ctrl+5) or lock it. -->
  <g id="zones" fill="none" stroke-width="0.5">
    <rect id="safe-area" x="6" y="6" width="108" height="108" stroke="#999999" stroke-dasharray="2 2"/>
    <rect id="plant-zone" x="10" y="8" width="100" height="84" stroke="#3DBE7A"/>
    <rect id="pot-zone" x="28" y="84" width="64" height="28" stroke="#E07A5F"/>
    <line id="pot-rim" x1="0" y1="84" x2="120" y2="84" stroke="#E07A5F" stroke-dasharray="4 2"/>
    <line id="base-line" x1="0" y1="112" x2="120" y2="112" stroke="#2E2A3B"/>
    <line id="center" x1="60" y1="0" x2="60" y2="120" stroke="#999999" stroke-dasharray="1 3"/>
    <rect id="face-area" x="36" y="50" width="48" height="32" rx="8" stroke="#7B6CF6"/>
  </g>
  <!-- Default anchors: move them to fit your plant; keep their names. -->
  <g id="anchors" fill="#FF00FF">
    <circle id="face" cx="60" cy="66" r="2"/>
    <circle id="head" cx="60" cy="36" r="2"/>
  </g>
  <!-- Scale reference: Brote's face at the default face anchor. Delete before exporting. -->
  <g id="reference" opacity="0.35">
    <circle cx="51" cy="62" r="4" fill="#2E2A3B"/>
    <circle cx="69" cy="62" r="4" fill="#2E2A3B"/>
    <path d="M53 72 q7 7 14 0" stroke="#2E2A3B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="42" cy="70" r="5" fill="#FF9FB0"/>
    <circle cx="78" cy="70" r="5" fill="#FF9FB0"/>
  </g>
</svg>
