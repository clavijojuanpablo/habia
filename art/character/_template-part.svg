<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- For eyes, mouths and accessories: the anchor is the artboard center (60,60). -->
  <g id="zones" fill="none" stroke-width="0.5">
    <line id="center-x" x1="60" y1="0" x2="60" y2="120" stroke="#999999" stroke-dasharray="1 3"/>
    <line id="center-y" x1="0" y1="60" x2="120" y2="60" stroke="#999999" stroke-dasharray="1 3"/>
    <rect id="face-area" x="36" y="44" width="48" height="32" rx="8" stroke="#7B6CF6"/>
    <line id="eye-line" x1="36" y1="56" x2="84" y2="56" stroke="#7B6CF6" stroke-dasharray="2 2"/>
    <line id="mouth-line" x1="36" y1="67" x2="84" y2="67" stroke="#F2667A" stroke-dasharray="2 2"/>
    <rect id="accessory-area" x="30" y="24" width="60" height="48" stroke="#F5B92E" stroke-dasharray="4 2"/>
  </g>
  <!-- Reference: Brote's happy face, centered on the anchor. Delete before exporting. -->
  <g id="reference" opacity="0.35">
    <circle cx="51" cy="56" r="4" fill="#2E2A3B"/>
    <circle cx="69" cy="56" r="4" fill="#2E2A3B"/>
    <circle cx="52.5" cy="54.5" r="1.4" fill="#FFFFFF"/>
    <circle cx="70.5" cy="54.5" r="1.4" fill="#FFFFFF"/>
    <path d="M53 66 q7 7 14 0" stroke="#2E2A3B" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="42" cy="64" r="5" fill="#FF9FB0"/>
    <circle cx="78" cy="64" r="5" fill="#FF9FB0"/>
  </g>
</svg>
